.build:
  extends: [.base, .export_path]
  script:
    - make clean build tiles=${tiles} target_platform=${target_platform} compiler=${compiler} control_core=${control_core} pulp_cores=${pulp_cores} spatz=${spatz}
  artifacts:
    paths: [ "build", "targets/${target_platform}/include/addr_map/tile_addr_map.h" ]

