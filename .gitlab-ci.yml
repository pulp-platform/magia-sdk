workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  MAGIA: './MAGIA'
  RISCV_GCC_BINROOT: /usr/pack/pulpsdk-1.0-kgf/artifactory/pulp-sdk-release/pkg/pulp_riscv_gcc/1.0.16/bin
  OPENHW_GCC_BINROOT: /usr/scratch2/lagrev5/anadalini/cv32e40p-gcc-toolchain/bin
  PYENV_BINROOT: /home/adequi/.pyenv/bin
  LLVM_DIR: /usr/pack/riscv-1.0-kgf/spatz-llvm-2023.08.10/
  GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PIPELINE_ID/$CI_JOB_ID"
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: "-ffdx"

.export_path:
  before_script:
    - export PATH=$OPENHW_GCC_BINROOT:$PATH
    - export PATH=$PYENV_BINROOT:$PATH
    - export LLVM_INSTALL_DIR=$LLVM_DIR

stages:
  - clone
  - python_setup
  - build_tiles_4_CV32E40P
  - build_test_tiles_4_spatz_CV32E40P
  - test_tiles_4_spatz_CV32E40P
  - build_test_tiles_4_cluster_CV32E40P
  - test_tiles_4_cluster_CV32E40P
  - build_test_tiles_4_spatz+cluster_CV32E40P
  - test_tiles_4_spatz+cluster_CV32E40P
  - build_tiles_1_CV32E40P
  - build_test_tiles_1_spatz_CV32E40P
  - test_tiles_1_spatz_CV32E40P
  - build_test_tiles_1_cluster_CV32E40P
  - test_tiles_1_cluster_CV32E40P
  - build_test_tiles_1_spatz+cluster_CV32E40P
  - test_tiles_1_spatz+cluster_CV32E40P
  - build_tiles_4_CV32E40X
  - build_test_tiles_4_spatz_CV32E40X
  - test_tiles_4_spatz_CV32E40X
  - build_test_tiles_4_cluster_CV32E40X
  - test_tiles_4_cluster_CV32E40X
  - build_test_tiles_4_spatz+cluster_CV32E40X
  - test_tiles_4_spatz+cluster_CV32E40X
  - build_tiles_1_CV32E40X
  - build_test_tiles_1_spatz_CV32E40X
  - test_tiles_1_spatz_CV32E40X
  - build_test_tiles_1_cluster_CV32E40X
  - test_tiles_1_cluster_CV32E40X
  - build_test_tiles_1_spatz+cluster_CV32E40X
  - test_tiles_1_spatz+cluster_CV32E40X
  - postscript

python_gvsoc:
  extends: [.base, .export_path]
  stage: python_setup
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  script:
    - eval "$(pyenv init -)"
    - pyenv local 3.12
    - python -m venv gvsoc_venv
    - source gvsoc_venv/bin/activate && pip install uv
    - source gvsoc_venv/bin/activate && uv pip install .
  artifacts:
    paths: [ "gvsoc_venv" ]


.base:
 artifacts:
  when: always
  expire_in: 4 week


clone_magia:
  extends: .base
  stage: clone
  script:
    - source scripts/deps.env
    - git clone https://github.com/pulp-platform/MAGIA.git
    - cd MAGIA && git fetch origin "$MAGIA_COMMIT" && git checkout "$MAGIA_COMMIT"
  artifacts:
    paths: [ "MAGIA" ]

clone_gvsoc:
  extends: .base
  stage: clone
  script:
    - make gvsoc_init
  artifacts:
    paths: [ "gvsoc" ]

.gvsoc:
  extends: [.base]
  script:
    - source gvsoc_venv/bin/activate && export CC=/usr/sepp/bin/gcc-11.2.0 && export CXX=/usr/sepp/bin/g++-11.2.0 && make gvsoc tiles=${tiles}
  artifacts:
    paths: [ "gvsoc/install" , "gvsoc/pulp/pulp/chips/magia_v2/arch.py"]

gvsoc_tiles_4:
  extends: .gvsoc
  stage: build_tiles_4_CV32E40P
  variables:
    tiles: 4
  artifacts:
    paths: [ "gvsoc/install" ]
  dependencies:
    - clone_gvsoc
    - python_gvsoc

gvsoc_tiles_1:
  extends: .gvsoc
  stage: build_tiles_1_CV32E40P
  variables:
    tiles: 1
  artifacts:
    paths: [ "gvsoc/install" ]
  dependencies:
    - clone_gvsoc
    - python_gvsoc


.MAGIA:
  extends: [.base]
  script:
    - make rtl-clean MAGIA_RTL_DIR=$MAGIA
    - make MAGIA MAGIA_RTL_DIR=$MAGIA tiles=${tiles} target_platform=${target_platform} control_core=${control_core} fast_sim=1
  artifacts:
    paths: [ "$MAGIA/work", "$MAGIA/sim/work", "$MAGIA/sim/modelsim.ini", "$MAGIA/scripts/sim_ret_errors.sh", "$MAGIA/scripts/compile.tcl", "$MAGIA/Makefile", "$MAGIA/hw/mesh/magia_pkg.sv", "$MAGIA/hw/tile/magia_tile_pkg.sv" ]

magia_v3_tiles_4_CV32E40P:
  extends: .MAGIA
  stage: build_tiles_4_CV32E40P
  variables:
    tiles: 4
    target_platform: magia_v3
    control_core: CV32E40P
  dependencies:
    - clone_magia

