.sim:
  extends: [.base, .export_path]
  script:
    - export TESTLOG="${TESTNAME##*/}"
    - make run MAGIA_RTL_DIR=$MAGIA platform=${platform} test=$TESTNAME tiles=${tiles} fast_sim=1 control_core=${control_core} > $TESTLOG.log
    - ./scripts/sim_ret_errors.sh $TESTLOG.log
  artifacts:
    paths: [ "*.log" ]
    expire_in: 2 weeks

.sim_gvsoc:
  extends: [.base, .export_path]
  script:
    - export TESTLOG="${TESTNAME##*/}"
    - source gvsoc_venv/bin/activate && make run MAGIA_RTL_DIR=$MAGIA platform=${platform} test=$TESTNAME tiles=${tiles} control_core=${control_core} > $TESTLOG.log
    - ./scripts/sim_ret_errors_gvsoc.sh $TESTLOG.log
  artifacts:
    paths: [ "*.log" ]
    expire_in: 2 weeks

