.sim:
  extends: [.base, .export_path]
  script:
    - for t in $TESTS; do make run MAGIA_RTL_DIR=$MAGIA platform=${platform} test=$t tiles=${tiles} fast_sim=1 control_core=${control_core} > $t.log && ./scripts/sim_ret_errors.sh $t.log || fail=1; done; exit ${fail:-0}
  artifacts:
    paths: [ "*.log" ]
    expire_in: 2 weeks

.sim_gvsoc:
  extends: [.base, .gvsoc_venv]
  script:
    - for t in $TESTS; do source gvsoc_venv/bin/activate && make run MAGIA_RTL_DIR=$MAGIA platform=${platform} test=$t tiles=${tiles} control_core=${control_core} > $t.log && ./scripts/sim_ret_errors_gvsoc.sh $t.log || fail=1; done; exit ${fail:-0}
  artifacts:
    paths: [ "*.log" ]
    expire_in: 2 weeks

magia_tiles_4_rtl_sim_spatz_CV32E40P:
  extends: [.sim]
  stage: test_tiles_4_spatz_CV32E40P
  variables:
    platform: rtl
    tiles: 4
    control_core: CV32E40P
  parallel:
    matrix:
      - TESTS: 
        - "test_helloworld test_cemm_global" 
        - "test_mm_is_2 test_mm_os_2 test_mm_ws_2" 
        - "test_gemv test_alloc" 
        - "test_mm_os_mglib" 
        - "test_mm_os_mgc"
        - "onnx_add onnx_ceil onnx_clip"
        - "onnx_div onnx_floor onnx_relu onnx_sub" 
        - "onnx_rmsnorm"
        - "onnx_silu" 
        - "onnx_swiglu"
        - "test_mm_matmul_mgc" 
        - "test_mm_matmul_mglib" 
        - "test_mm_os_mgc test_mm_ws_mgc"
        - "test_mm_is_mgc test_conv_im2col_partial"
